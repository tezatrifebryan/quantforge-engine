[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge-engine"
version = "0.1.0a1"
description = "A modular quantitative trading framework."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "ccxt>=4.5.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.10.0",
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.12.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.coverage.run]
branch = true
source = [
    "quantforge",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
